name: Deploy Three-Tier Application to Azure VM

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure VM
        uses: azure/cli@v2.1.0
        timeout-minutes: 15
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GITHUB_REPO: ${{ github.repository }}
        with:
          inlineScript: |
            echo "Deploying to Resource Group: $AZURE_RESOURCE_GROUP"
            echo "Deploying to VM: $AZURE_VM_NAME"
            echo "Repository: $GITHUB_REPO"
            
            # Deploy directly from GitHub
            az vm run-command invoke \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_VM_NAME" \
              --command-id RunShellScript \
              --scripts "
              # Configuration
              APP_DIR='/opt/notes-app'
              GITHUB_REPO='$GITHUB_REPO'
              
              echo 'Starting deployment...'
              echo 'Target directory: \$APP_DIR'
              echo 'Repository: \$GITHUB_REPO'
              
              # Create application directory
              sudo mkdir -p \$APP_DIR
              sudo chown azureuser:azureuser \$APP_DIR
              
              # Navigate to app directory
              cd \$APP_DIR
              
              # Clone or update repository
              if [ -d '.git' ]; then
                echo 'Updating repository...'
                git pull origin main
              else
                echo 'Cloning repository...'
                git clone https://github.com/\$GITHUB_REPO.git .
              fi
              
              # Create .env file with secure credentials
              echo 'Creating environment file...'
              cat > .env << EOF
              POSTGRES_DB=$POSTGRES_DB
              POSTGRES_USER=$POSTGRES_USER
              POSTGRES_PASSWORD=$POSTGRES_PASSWORD
              REACT_APP_API_URL=http://\$(curl -s http://checkip.amazonaws.com):3001
              EOF
              
              echo 'Environment file created:'
              cat .env
              
              # Stop existing containers
              echo 'Stopping existing containers...'
              docker compose down || true
              
              # Build and start the application
              echo 'Building and starting application...'
              docker compose up --build -d
              
              # Wait for services to start
              echo 'Waiting for services to start...'
              sleep 45
              
              # Check service status and logs
              echo 'Checking service status...'
              docker compose ps
              
              echo 'Checking container logs...'
              docker compose logs --tail=20
              
              echo 'Checking if ports are listening...'
              netstat -tlnp | grep -E ':(3000|3001|5432)'
              
              echo 'Testing local connectivity...'
              curl -I http://localhost:3000 || echo 'Frontend not responding'
              curl -I http://localhost:3001 || echo 'Backend not responding'
              
              echo 'Deployment completed successfully!'
              "

  test:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Test Application Connectivity
        uses: azure/cli@v2.1.0
        timeout-minutes: 10
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_VM_NAME: ${{ secrets.AZURE_VM_NAME }}
        with:
          inlineScript: |
            echo "Testing connectivity on Resource Group: $AZURE_RESOURCE_GROUP"
            echo "Testing connectivity on VM: $AZURE_VM_NAME"
            
            # Test connectivity and get VM public IP
            az vm run-command invoke \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$AZURE_VM_NAME" \
              --command-id RunShellScript \
              --scripts '
              echo "=== System Information ==="
              echo "VM Public IP: \$(curl -s http://checkip.amazonaws.com)"
              echo "Docker status: \$(systemctl is-active docker)"
              
              echo "=== Container Status ==="
              cd /opt/notes-app
              docker compose ps
              
              echo "=== Port Status ==="
              netstat -tlnp | grep -E ":(3000|3001|5432)"
              
              echo "=== Testing Local Connectivity ==="
              curl -I http://localhost:3000 || echo "Frontend not responding on localhost:3000"
              curl -I http://localhost:3001 || echo "Backend not responding on localhost:3001"
              
              echo "=== Recent Container Logs ==="
              docker compose logs --tail=10 frontend || echo "No frontend logs"
              docker compose logs --tail=10 backend || echo "No backend logs"
              
              echo "=== Firewall Status ==="
              sudo ufw status || echo "UFW not configured"
              
              echo "Basic connectivity test completed!"
              '